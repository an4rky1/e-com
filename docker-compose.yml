name: auth-platform

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: auth-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Catalog is the one service whose document model does not fit Postgres: product variants
  # are a nested array of free-form attribute maps, which in Postgres would be EAV or JSONB
  # over JSONB. MongoDB takes that shape natively. The rule that keeps this from spreading:
  # this container exists for `catalog` alone, and no other service is ever given a Mongo URL.
  mongo:
    image: docker.io/library/mongo:7
    container_name: auth-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Double-quoted outer, single-quoted inner: a flow sequence cannot nest the same
      # quote, and podman-compose's YAML parser is the strict one that proves it.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Elasticsearch is the search engine behind the catalog's text search. Single node,
  # security disabled — the platform's data is not sensitive and the search index is a
  # derived projection it can lose without harm.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: auth-elasticsearch
    command:
      - /usr/share/elasticsearch/bin/elasticsearch
      - -Ediscovery.type=single-node
      - -Expack.security.enabled=false
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9200/_cluster/health']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # Redpanda is API-compatible with the Kafka protocol the services speak, without a JVM.
  redpanda:
    image: docker.io/redpandadata/redpanda:v24.2.2
    container_name: auth-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - '9092:9092'
      - '9644:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', 'rpk cluster health --exit-when-healthy || exit 1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # --- Observability -------------------------------------------------------------
  # The three backends the platform's telemetry lands in. All three use `network_mode: host`
  # rather than published ports: Prometheus must reach services that listen on the *host*
  # (localhost targets), and a per-runtime gateway name (`host.containers.internal` under
  # podman, `host-gateway` under docker) is the one detail here that would otherwise behave
  # differently depending on which runtime started the stack. Host networking makes the
  # localhost in prometheus.yml mean the same thing everywhere.
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.57
    container_name: auth-jaeger
    network_mode: host
    environment:
      COLLECTOR_OTLP_ENABLED: 'true' # OTLP on 4317 (gRPC) / 4318 (HTTP) — the SDK's default target

  prometheus:
    image: docker.io/prom/prometheus:v2.53.0
    container_name: auth-prometheus
    network_mode: host
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Port 3100, not Grafana's default 3000: the front owns 3000 on the host, and host
  # networking gives no ports block to remap it with.
  grafana:
    image: docker.io/grafana/grafana:11.1.0
    container_name: auth-grafana
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: '3100'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Topic and message browser for the event bus: browse platform.* topics, follow messages in
  # live tail, inspect consumer groups. Same host-networking reasoning as above — redpanda
  # advertises PLAINTEXT://localhost:9092, so a bridge-network container would be told to
  # reconnect to *its* localhost after the metadata fetch and fail on the next dial.
  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:v0.7.2
    container_name: auth-kafka-ui
    network_mode: host
    environment:
      KAFKA_CLUSTERS_0_NAME: auth-platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  redpanda-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data: