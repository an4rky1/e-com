name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Configure Nx Agents and task distribution in .nx/ci-config.yaml
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#nx-cloud-start-nx-agents
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: npx nx start-nx-agents

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      # The Prisma clients are not committed (see .gitignore), so a clean checkout has none
      # until they are built from each service's schema.
      - run: npm run generate
      - run: npx playwright install --with-deps

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- echo Hello World
      # When you enable task distribution, run the e2e-ci task instead of e2e
      - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()

  backend-e2e:
    # Unit tests cannot see a misconfigured peer address, a domain value the database
    # rejects, or an exception filter that reports every failure as "unavailable" — all three
    # of those shipped green through `test` and were found only by starting the services.
    # These scripts boot the real thing against real Postgres/Redpanda, so they stay in CI.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redpanda:
        image: redpandadata/redpanda:v24.2.2
        ports:
          - 9092:9092
        options: >-
          --health-cmd "rpk cluster health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Same reason as the job above: the clients are generated, never committed.
      - run: npm run generate

      - name: Create the per-service databases
        # The names are the ones the services actually connect to — `notify` for
        # notification, `session_engine` for session — not the directory names.
        # api-gateway is absent on purpose: it holds no state.
        run: |
          for db in identity access_control credential_vault session_engine auth_flow \
                    mfa api_key account_security notify audit_log; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
              -c "CREATE DATABASE $db"
          done

      - name: Apply the Prisma migrations
        # Creating the database creates no tables: Prisma Migrate is the only thing in this
        # repository that does, and without this step the first service to boot dies on
        # `relation "users" does not exist`. The script owns the directory-name-to-database-name
        # mapping (it is not the identity) and the engine paths, so a laptop and this job cannot
        # disagree about which schema lands in which database.
        run: bash tools/migrate.sh

      - name: Boot every application
        run: bash tools/boot-check.sh

      - name: Registration, outbox and notification
        run: bash tools/e2e-registration.sh

      - name: Sign-in, session and token validation
        run: bash tools/e2e-login.sh

      - name: Public gateway edge
        run: bash tools/e2e-gateway.sh

      - name: Rate limiting at the edge
        # Needs Redis reachable, which the service container above provides. The script boots
        # only the edge: the guard runs before any peer is contacted, so a 429 is produced
        # without any of the other services.
        env:
          REDIS_URL: redis://localhost:6379
        run: bash tools/e2e-rate-limit.sh

  terraform:
    # The offline plan is the only test that sees a wrong peer address in the balancer's
    # rules, a TLS listener wired to no certificate, or a scaling target naming a service
    # ECS does not have — `terraform validate` alone does not, and an apply needs an AWS
    # account this repository does not have yet. `tools/local-infra-test.sh` runs the
    # apply against an emulator on a laptop; this job gates the two cheap halves on every
    # push so a broken plan never waits for someone's machine.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      # Pinned to the version the local runs use: mock-provider behaviour is version
      # sensitive (override_during is a 1.7+ feature restated per resource), and a
      # silent major bump would change what the assertions can see.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Format and validate every directory
        run: make infra-validate

      - name: Plan the dev stack on mock providers
        run: make infra-test
