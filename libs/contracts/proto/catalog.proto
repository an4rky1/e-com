syntax = "proto3";

package catalog.v1;

// Catalog owns the product document: name, category path, variants with free-form
// attributes, and price in minor units. It never owns stock (inventory's fact) and
// never owns a cart or an order.
service CatalogService {
  rpc GetProduct (GetProductRequest) returns (Product);
  rpc ListByCategory (ListByCategoryRequest) returns (ProductList);
  // Text search over the product name and description, in relevance order. The engine
  // that answers it is the platform's search infrastructure, not the catalog's SQL —
  // `total` is the match count across the whole catalogue, not the page length.
  rpc SearchProducts (SearchProductsRequest) returns (ProductList);
  // Bulk price lookup for the cart: the cart validates its price snapshot against the
  // data owner rather than trusting what the browser sent.
  rpc GetPricing (GetPricingRequest) returns (GetPricingResponse);
  rpc CreateProduct (CreateProductRequest) returns (Product);
  rpc SetVariantPrice (SetVariantPriceRequest) returns (Product);
  rpc ArchiveProduct (ArchiveProductRequest) returns (Product);
}

// Minor units, integer. float in money is a bug that surfaces a month later in
// reconciliation, so the wire type is a string: int64 does not survive JSON-number
// conversion at 53 bits, and sums quietly gain a unit.
message Money {
  string amount_minor = 1;
  string currency = 2;
}

message Variant {
  string sku = 1;
  Money price = 2;
  map<string, string> attrs = 3;
  bool active = 4;
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string category_path = 4;
  repeated Variant variants = 5;
  repeated string media_keys = 6;
  bool active = 7;
  int32 version = 8;
  Money price_range_min = 9;
  Money price_range_max = 10;
}

message GetProductRequest {
  string id = 1;
}

message ListByCategoryRequest {
  repeated string category_path = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchProductsRequest {
  string text = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ProductList {
  repeated Product products = 1;
  int32 total = 2;
}

message GetPricingRequest {
  repeated string skus = 1;
}

message PricedSku {
  string sku = 1;
  string product_id = 2;
  Money price = 3;
  bool active = 4;
}

message GetPricingResponse {
  repeated PricedSku prices = 1;
}

message CreateVariant {
  string sku = 1;
  Money price = 2;
  map<string, string> attrs = 3;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  repeated string category_path = 3;
  repeated CreateVariant variants = 4;
  repeated string media_keys = 5;
}

message SetVariantPriceRequest {
  string product_id = 1;
  string sku = 2;
  Money price = 3;
}

message ArchiveProductRequest {
  string product_id = 1;
  string reason = 2;
}
