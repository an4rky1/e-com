syntax = "proto3";

package session_token.v1;

// Session engine answers "what did we issue, and is it still valid". Issue and revocation
// live here; the decision to authenticate is auth-gateway's.
service SessionTokenService {
  rpc IssueTokens (IssueTokensRequest) returns (IssueTokensResponse);
  rpc RotateTokens (RotateTokensRequest) returns (RotateTokensResponse);
  rpc RevokeSession (RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeAllSessions (RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
  rpc ValidateAccessToken (ValidateAccessTokenRequest) returns (ValidateAccessTokenResponse);
}

message IssueTokensRequest {
  string user_id = 1;
  string email = 2;
  repeated string roles = 3;
  repeated string permissions = 4;
  string device_id = 5;
  string ip_address = 6;
}

message IssueTokensResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  string session_id = 4;
}

message RotateTokensRequest {
  string refresh_token = 1;
  string ip_address = 2;
  string device_id = 3;
}

message RotateTokensResponse {
  string access_token = 1;
  string refresh_token = 2;
  int32 expires_in = 3;
  string session_id = 4;
  // True when a previously-consumed refresh token was replayed. Every session for the
  // user is revoked before this response is returned.
  bool reuse_detected = 5;
}

message RevokeSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message RevokeSessionResponse {
  bool ok = 1;
}

message RevokeAllSessionsRequest {
  string user_id = 1;
  string reason = 2;
  // Keeps the caller's current session alive — used for "sign out everywhere else".
  string except_session_id = 3;
}

message RevokeAllSessionsResponse {
  int32 revoked_count = 1;
}

message ValidateAccessTokenRequest {
  string access_token = 1;
}

message ValidateAccessTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
  string session_id = 6;
  // Set when the token is cryptographically valid but the session was revoked.
  string revocation_reason = 7;
}