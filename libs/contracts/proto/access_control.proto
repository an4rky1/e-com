syntax = "proto3";

package access_control.v1;

// Access control answers "what is this user allowed to do". It never authenticates.
service AccessControlService {
  rpc GetPermissions (GetPermissionsRequest) returns (GetPermissionsResponse);
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GrantRole (GrantRoleRequest) returns (GrantRoleResponse);
  rpc RevokeRole (RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc EvaluatePolicy (EvaluatePolicyRequest) returns (EvaluatePolicyResponse);
  // Administrative read: the role catalogue, for an operator who has to know which role
  // to grant. The decision RPCs above stay the hot path; this one is not called per request.
  rpc ListRoles (ListRolesRequest) returns (ListRolesResponse);
}

message GetPermissionsRequest {
  string user_id = 1;
}

message GetPermissionsResponse {
  repeated string roles = 1;
  repeated string permissions = 2;
}

message CheckPermissionRequest {
  string user_id = 1;
  string permission = 2;
  // Subject attributes for ABAC rules. Deny wins over allow.
  map<string, string> context = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
  // Why the decision went the way it did — surfaced to operators, not to end users.
  string reason = 2;
}

message GrantRoleRequest {
  string user_id = 1;
  string role = 2;
  string granted_by = 3;
}

message GrantRoleResponse {
  repeated string roles = 1;
}

message RevokeRoleRequest {
  string user_id = 1;
  string role = 2;
}

message RevokeRoleResponse {
  repeated string roles = 1;
}

message EvaluatePolicyRequest {
  string user_id = 1;
  string policy = 2;
  map<string, string> resource = 3;
  map<string, string> context = 4;
}

message EvaluatePolicyResponse {
  bool allowed = 1;
  string reason = 2;
}

message ListRolesRequest {
  // Case-insensitive fragment matched against the name and its permissions; empty lists all.
  string search = 1;
  int32 page = 2;
  int32 limit = 3;
}

message RoleSummary {
  string name = 1;
  repeated string permissions = 2;
  // Empty when the role has no description: proto3 has no null string.
  string description = 3;
  bool is_system = 4;
}

message ListRolesResponse {
  repeated RoleSummary roles = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}