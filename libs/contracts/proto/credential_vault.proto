syntax = "proto3";

package credential_vault.v1;

// Credential vault answers "prove you are this user". It holds secrets but never knows
// whether a user account exists — that is identity's job.
service CredentialVaultService {
  rpc VerifyPassword (VerifyPasswordRequest) returns (VerifyPasswordResponse);
  rpc SetPassword (SetPasswordRequest) returns (SetPasswordResponse);
  rpc RevokeAllCredentials (RevokeAllCredentialsRequest) returns (RevokeAllCredentialsResponse);
}

message VerifyPasswordRequest {
  string user_id = 1;
  string password = 2;
  // Triggers an Argon2id rehash when the stored parameters are outdated.
  bool allow_rehash = 3;
}

message VerifyPasswordResponse {
  bool valid = 1;
  // Set when the stored hash used weaker parameters than the current policy.
  bool needs_rehash = 2;
  int32 failed_attempts = 3;
}

message SetPasswordRequest {
  string user_id = 1;
  string new_password = 2;
}

message SetPasswordResponse {
  bool ok = 1;
  string credential_id = 2;
}

message RevokeAllCredentialsRequest {
  string user_id = 1;
  string reason = 2;
}

message RevokeAllCredentialsResponse {
  int32 revoked_count = 1;
}